    :root {
      /* éˆ¹â‚¬éˆ¹â‚¬ Radius éˆ¹â‚¬éˆ¹â‚¬ */
      --radius:    8px;
      --radius-sm: 4px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --btn-radius: 8px;
      --input-radius: 8px;

      /* éˆ¹â‚¬éˆ¹â‚¬ Typography éˆ¹â‚¬éˆ¹â‚¬ */
      --font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --text-hero-size:     56px;
      --text-hero-weight:   600;
      --text-hero-lh:       1.1;
      --text-hero-ls:       -0.02em;
      --text-display-size:  40px;
      --text-display-weight:600;
      --text-display-lh:    1.2;
      --text-display-ls:    0;
      --text-title-size:    20px;
      --text-title-weight:  600;
      --text-lead-size:     18px;
      --text-lead-weight:   400;
      --text-lead-lh:       1.5;
      --text-body-size:     16px;
      --text-body-weight:   400;
      --text-body-lh:       1.6;
      --text-caption-size:  12px;
      --text-label-size:    14px;
      --text-label-weight:  500;

      /* éˆ¹â‚¬éˆ¹â‚¬ Page & Region Colors éˆ¹â‚¬éˆ¹â‚¬ */
      --accent:               #2563eb;
      --accent-secondary:     #2563eb;
      --page-bg:              #f9fafb;
      --page-text:            #111827;
      --text-muted:           #6b7280;
      --text-subtle:          #9ca3af;
      --region-header-bg:     #2563eb;
      --region-header-text:   #ffffff;
      --region-main-bg:       #ffffff;
      --region-main-bg-elevated: #ffffff;
      --region-main-bg-sunken: #f9fafb;
      --region-sidebar-bg:    #ffffff;
      --region-footer-bg:     #2563eb;
      --region-footer-text:   #ffffff;
      --border-color:         #e5e7eb;
      --border-strong:        #d1d5db;

      /* éˆ¹â‚¬éˆ¹â‚¬ Shadows éˆ¹â‚¬éˆ¹â‚¬ */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.10);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.10);

      /* éˆ¹â‚¬éˆ¹â‚¬ Card éˆ¹â‚¬éˆ¹â‚¬ */
      --card-bg:     var(--region-main-bg);
      --card-border: var(--border-color);
      --card-shadow: var(--shadow-sm);
      --card-text:   #111827;
      --card-muted:  #6b7280;

      /* éˆ¹â‚¬éˆ¹â‚¬ Buttons éˆ¹â‚¬éˆ¹â‚¬ */
      --button-primary-bg:      #2563eb;
      --button-primary-text:    #ffffff;
      --button-primary-border:  #2563eb;
      --button-secondary-bg:    var(--region-main-bg);
      --button-secondary-text:  var(--page-text);
      --button-secondary-border:var(--border-strong);
      --button-ghost-text:      var(--accent);
      --button-danger-bg:       #dc2626;
      --button-danger-text:     #ffffff;

      /* éˆ¹â‚¬éˆ¹â‚¬ Inputs éˆ¹â‚¬éˆ¹â‚¬ */
      --input-bg:           var(--region-main-bg);
      --input-border:       var(--border-color);
      --input-border-focus: #2563eb;
      --input-text:         var(--page-text);
      --input-placeholder:  var(--text-subtle);

      /* éˆ¹â‚¬éˆ¹â‚¬ Table éˆ¹â‚¬éˆ¹â‚¬ */
      --table-header-bg:   var(--region-main-bg-sunken);
      --table-header-text: var(--text-muted);
      --table-row-hover:   var(--region-main-bg-sunken);
      --table-border:      var(--border-color);

      /* éˆ¹â‚¬éˆ¹â‚¬ Semantic Badge Colors éˆ¹â‚¬éˆ¹â‚¬ */
      --badge-success-bg:  #16a34a;
      --badge-success-text:#ffffff;
      --badge-error-bg:    #dc2626;
      --badge-error-text:  #ffffff;
      --badge-warning-bg:  #d97706;
      --badge-warning-text:#ffffff;
      --badge-neutral-bg:  var(--region-main-bg-sunken);
      --badge-neutral-text:var(--text-muted);
    }

    body {
      font-family: var(--font-family);
      background-color: var(--page-bg);
      color: var(--page-text);
      line-height: var(--text-body-lh);
      font-size: var(--text-body-size);
      -webkit-font-smoothing: antialiased;
    }

    /* éˆ¹â‚¬éˆ¹â‚¬ Typography Classes éˆ¹â‚¬éˆ¹â‚¬ */
    .si-text-hero    { font-size: var(--text-hero-size);    font-weight: var(--text-hero-weight);    line-height: var(--text-hero-lh);    letter-spacing: var(--text-hero-ls); }
    .si-text-display { font-size: var(--text-display-size); font-weight: var(--text-display-weight); line-height: var(--text-display-lh); letter-spacing: var(--text-display-ls); }
    .si-text-title   { font-size: var(--text-title-size);   font-weight: var(--text-title-weight); }
    .si-text-lead    { font-size: var(--text-lead-size);    font-weight: var(--text-lead-weight);    line-height: var(--text-lead-lh); }
    .si-text-body    { font-size: var(--text-body-size);    font-weight: var(--text-body-weight);    line-height: var(--text-body-lh); }
    .si-text-caption { font-size: var(--text-caption-size); color: var(--text-muted); }
    .si-text-label   { font-size: var(--text-label-size);   font-weight: var(--text-label-weight); }
    .si-text-muted   { color: var(--text-muted); }
    .si-text-subtle  { color: var(--text-subtle); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Layout Utilities éˆ¹â‚¬éˆ¹â‚¬ */
    .si-container     { width: 100%; margin-left: auto; margin-right: auto; padding-left: 1.5rem; padding-right: 1.5rem; }
    .si-container-full{ max-width: 100% !important; padding: 0 !important; }
    .si-sticky-top    { position: sticky; top: 0; z-index: 40; }
    .si-divider       { height: 1px; background-color: var(--border-color); width: 100%; margin: 1rem 0; }

    /* éˆ¹â‚¬éˆ¹â‚¬ Cards éˆ¹â‚¬éˆ¹â‚¬ */
    .si-card {
      background-color: var(--card-bg);
      color: var(--card-text);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    .si-card-elevated { background-color: var(--region-main-bg-elevated); box-shadow: var(--shadow-md); }
    .si-card-sunken   { background-color: var(--region-main-bg-sunken); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Buttons éˆ¹â‚¬éˆ¹â‚¬ */
    .si-btn         { border-radius: var(--btn-radius); border-color: transparent; cursor: pointer; }
    .si-btn-primary { background-color: var(--button-primary-bg) !important; color: var(--button-primary-text) !important; border-color: var(--button-primary-border) !important; }
    .si-btn-primary:hover { opacity: 0.9; }
    .si-btn-secondary { background-color: var(--button-secondary-bg) !important; color: var(--button-secondary-text) !important; border: 1px solid var(--button-secondary-border) !important; }
    .si-btn-ghost { background: transparent !important; color: var(--button-ghost-text) !important; border-color: transparent !important; }
    .si-btn-ghost:hover { background-color: var(--region-main-bg-sunken) !important; }
    .si-btn-danger { background-color: var(--button-danger-bg) !important; color: var(--button-danger-text) !important; }

    /* éˆ¹â‚¬éˆ¹â‚¬ Accent color classes (follow design spec primary color) éˆ¹â‚¬éˆ¹â‚¬ */
    .si-accent-btn        { background-color: var(--button-primary-bg); color: var(--button-primary-text); border-radius: var(--btn-radius); }
    .si-accent-btn:hover  { opacity: 0.9; }
    .si-accent-text       { color: var(--accent); }
    .si-accent-border     { border-color: var(--accent); }
    .si-accent-bg-light   { background-color: color-mix(in srgb, var(--accent) 10%, white); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Accent-secondary (second brand color) éˆ¹â‚¬éˆ¹â‚¬ */
    .si-btn-accent-secondary { background-color: var(--accent-secondary) !important; color: #ffffff !important; border-color: var(--accent-secondary) !important; border-radius: var(--btn-radius); }
    .si-btn-accent-secondary:hover { opacity: 0.9; }
    .si-accent-secondary-text   { color: var(--accent-secondary); }
    .si-accent-secondary-border { border-color: var(--accent-secondary); }
    .si-accent-secondary-bg-light { background-color: color-mix(in srgb, var(--accent-secondary) 10%, white); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Inputs éˆ¹â‚¬éˆ¹â‚¬ */
    .si-input {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--input-radius);
      color: var(--input-text);
      font-size: var(--text-body-size);
    }
    .si-input:focus { outline: none; border-color: var(--input-border-focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    .si-input::placeholder { color: var(--input-placeholder); }
    .si-label { font-size: var(--text-label-size); font-weight: var(--text-label-weight); color: var(--page-text); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Tables éˆ¹â‚¬éˆ¹â‚¬ */
    .si-table-header { background-color: var(--table-header-bg); color: var(--table-header-text); font-size: var(--text-caption-size); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .si-table-row    { border-bottom: 1px solid var(--table-border); }
    .si-table-row:hover { background-color: var(--table-row-hover); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Badges éˆ¹â‚¬éˆ¹â‚¬ */
    .si-badge         { display: inline-flex; align-items: center; border-radius: var(--radius-full); padding: 2px 8px; font-size: var(--text-caption-size); font-weight: 600; }
    .si-badge-success { background-color: var(--badge-success-bg); color: var(--badge-success-text); }
    .si-badge-error   { background-color: var(--badge-error-bg);   color: var(--badge-error-text); }
    .si-badge-warning { background-color: var(--badge-warning-bg); color: var(--badge-warning-text); }
    .si-badge-neutral { background-color: var(--badge-neutral-bg); color: var(--badge-neutral-text); }

    /* éˆ¹â‚¬éˆ¹â‚¬ Override hardcoded Tailwind colors with design spec tokens éˆ¹â‚¬éˆ¹â‚¬ */
    /* Border colors */
    .border-gray-100, .border-gray-200 { border-color: var(--border-color) !important; }
    .border-gray-300, .border-gray-400 { border-color: var(--border-strong) !important; }
    /* Background surfaces */
    .bg-gray-50  { background-color: var(--region-main-bg-sunken) !important; }
    .bg-gray-100 { background-color: var(--region-main-bg-sunken) !important; }
    .bg-gray-200 { background-color: var(--border-color) !important; }
    .bg-white    { background-color: var(--region-main-bg) !important; }
    /* Text colors */
    .text-gray-900, .text-gray-800 { color: var(--page-text) !important; }
    .text-gray-700, .text-gray-600 { color: var(--text-muted) !important; }
    .text-gray-500, .text-gray-400 { color: var(--text-subtle) !important; }
    .si-card .text-gray-900, .si-card .text-gray-800 { color: var(--card-text) !important; }
    .si-card .text-gray-700, .si-card .text-gray-600 { color: var(--card-muted) !important; }
    /* Border radius éˆ?follow design spec radius */
    .rounded-xl  { border-radius: var(--radius-lg) !important; }
    .rounded-lg  { border-radius: var(--radius) !important; }
    .rounded-md  { border-radius: var(--radius-sm) !important; }
    .rounded-2xl { border-radius: var(--radius-lg) !important; }
    /* Shadows éˆ?follow design spec shadow tokens */
    .shadow-sm { box-shadow: var(--shadow-sm) !important; }
    .shadow-md { box-shadow: var(--shadow-md) !important; }
    .shadow-lg { box-shadow: var(--shadow-lg) !important; }

    /* éˆ¹â‚¬éˆ¹â‚¬ Card Hover Effects éˆ¹â‚¬éˆ¹â‚¬ */
    .si-card-hover { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s; }
    .si-card-hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

    .si-img { aspect-ratio: 4:3; width: 100%; object-fit: cover; background-color: var(--region-main-bg-sunken); }
    .si-video { aspect-ratio: 16 / 9; width: 100%; object-fit: cover; background-color: #000; }

    /* éˆ¹â‚¬éˆ¹â‚¬ Multi-select (operations.select) éˆ¹â‚¬éˆ¹â‚¬ */
    .si-sel-item { position: relative; cursor: pointer; }
    .si-sel-item .si-sel-cb {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      width: 18px; height: 18px; border-radius: 4px;

<script>
(function() {
  var accentHex = '#2563eb';
  var grid = document.querySelector('main > .grid');
  if (!grid) return;
  var secs = Array.from(grid.children);
  var byPos = { header: [], hero: [], main: [], sidebar: [], footer: [] };
  secs.forEach(function(el) {
    var pos = el.getAttribute('data-position') || 'main';
    if (byPos[pos]) byPos[pos].push(el); else byPos.main.push(el);
  });
  var hasNonMain = byPos.header.length || byPos.hero.length || byPos.sidebar.length || byPos.footer.length;
  if (!hasNonMain) return;
  var hasSidebarRegion = byPos.sidebar.length > 0;
  var _mainWidthMode = 'contained';

  var gap = 'gap-4';
  var wrap = document.createElement('div');
  wrap.className = 'flex flex-col gap-6';

  if (byPos.header.length) {
    var headerEl = document.createElement('div');
    headerEl.className = 'grid grid-cols-12 gap-4 pb-4 border-b border-gray-200';
    if ('contained' === 'full' || hasSidebarRegion) {
      headerEl.style.cssText = 'width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:24px;padding-right:24px;';
    }
    byPos.header.forEach(function(el) { headerEl.appendChild(el); });
    wrap.appendChild(headerEl);
  }

  if (byPos.hero.length) {
    var heroEl = document.createElement('div');
    heroEl.className = 'rounded-2xl overflow-hidden grid grid-cols-12 gap-4';
    heroEl.style.cssText = 'background:linear-gradient(135deg,#fffbe6 0%,#fff9c4 50%,#fef3c7 100%);padding:40px 48px;';
    if ('contained' === 'full') {
      heroEl.style.cssText += 'width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;';
    }
    byPos.hero.forEach(function(el) { heroEl.appendChild(el); });
    wrap.appendChild(heroEl);
  }

  var hasSidebar = hasSidebarRegion;
  var hasMain = byPos.main.length > 0;
  if (hasSidebar || hasMain) {
    var contentRow = document.createElement('div');
    contentRow.className = hasSidebar ? 'flex gap-6 items-start' : '';
    contentRow.dataset.regionRow = 'body';
    if (hasSidebar && _mainWidthMode === 'full') {
      contentRow.style.paddingLeft = '1.5rem';
      contentRow.style.paddingRight = '1.5rem';
    }
    var mainGrid = document.createElement('div');
    mainGrid.className = (hasSidebar ? 'flex-1 min-w-0 ' : '') + 'grid grid-cols-12 gap-4';
    byPos.main.forEach(function(el) { mainGrid.appendChild(el); });

    if (hasSidebar) {
    // Sidebar placement is explicit when style.sidebar_side is set.
    // Otherwise filters and navigation rails go left; summaries/actions stay right.
    var leftSidebarItems = [], rightSidebarItems = [];
    byPos.sidebar.forEach(function(el) {
      var lay = el.getAttribute('data-layout') || '';
      var side = (el.getAttribute('data-sidebar-side') || '').toLowerCase();
      if (side === 'right') rightSidebarItems.push(el);
      else if (side === 'left' || lay === 'filter-panel' || lay === 'filter' || lay === 'site-nav' || lay === 'nav-links' || lay === 'nav-bar' || lay === 'main-header' || lay === 'minimal-header' || lay === 'commerce-header' || lay === 'dashboard-header' || lay === 'split-header' || lay === 'app-header' || lay === 'compact-header' || lay === 'mega-header' || lay === 'hero-header' || lay === 'tabbed-header' || lay === 'glass-header' || lay === 'command-header' || lay === 'logo' || lay === 'search-bar' || lay === 'icon-actions') leftSidebarItems.push(el);
      else rightSidebarItems.push(el);
    });
    function sidebarSpan(items, fallback) {
      var vals = items.map(function(el) { return parseInt(el.dataset.sidebarWidth || '', 10); }).filter(function(n) { return Number.isFinite(n) && n > 0; });
      return Math.max(2, Math.min(6, vals.length ? Math.max.apply(null, vals) : fallback));
    }
    function sidebarBasis(span) {
      return 'calc((100% - 1.5rem) * ' + span + ' / 12)';
    }
    function applySidebarChrome(aside) {
      var bg = '';
      var shadow = '';
      if (bg || (shadow && shadow !== 'none')) {
        aside.style.border = '1px solid var(--border-color)';
        aside.style.borderRadius = 'var(--radius-lg)';
        aside.style.padding = '1rem';
      }
      if (bg) {
        aside.style.background = bg === 'dark' ? '#111827' : bg === 'gray' ? '#f3f4f6' : bg === 'light' ? 'var(--region-main-bg-sunken)' : '#ffffff';
        if (bg === 'dark') {
          aside.style.color = '#ffffff';
        }
      }
      if (shadow && shadow !== 'none') {
        aside.style.boxShadow = shadow === 'xl' ? '0 20px 25px -5px rgb(0 0 0 / 0.12), 0 8px 10px -6px rgb(0 0 0 / 0.10)' : 'var(--shadow-' + shadow + ')';
      }
    }

    if (leftSidebarItems.length) {
      var leftEl = document.createElement('aside');
      var leftSpan = sidebarSpan(leftSidebarItems, 3);
      leftEl.className = 'flex-shrink-0 flex flex-col gap-4';
      leftEl.dataset.regionSide = 'left';
      leftEl.dataset.sidebarSpan = String(leftSpan);
      leftEl.style.flexBasis = sidebarBasis(leftSpan);
      leftEl.style.maxWidth = sidebarBasis(leftSpan);
      applySidebarChrome(leftEl);
      leftSidebarItems.forEach(function(el) { el.classList.add('w-full'); el.style.width = '100%'; leftEl.appendChild(el); });
      contentRow.appendChild(leftEl);
    }
    contentRow.appendChild(mainGrid);
    if (rightSidebarItems.length) {
      var rightEl = document.createElement('aside');
      var rightSpan = sidebarSpan(rightSidebarItems, 3);
      rightEl.className = 'flex-shrink-0 flex flex-col gap-4';
      rightEl.dataset.regionSide = 'right';
      rightEl.dataset.sidebarSpan = String(rightSpan);
      rightEl.style.flexBasis = sidebarBasis(rightSpan);
      rightEl.style.maxWidth = sidebarBasis(rightSpan);
      applySidebarChrome(rightEl);
      rightSidebarItems.forEach(function(el) { el.classList.add('w-full'); el.style.width = '100%'; rightEl.appendChild(el); });
      contentRow.appendChild(rightEl);
    }
    } else {
      contentRow.appendChild(mainGrid);
    }
    wrap.appendChild(contentRow);
  }

  if (byPos.footer.length) {
    var footerEl = document.createElement('div');
    footerEl.className = 'mt-8';
    footerEl.style.cssText = 'background:var(--region-footer-bg);color:var(--region-footer-text);';
    if ('full' !== 'contained') {
      footerEl.style.cssText += 'width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);';
    }
    var footerInner = document.createElement('div');
    footerInner.className = ('full' === 'contained' ? 'max-w-6xl mx-auto ' : 'w-full ') + 'grid grid-cols-12 gap-4 px-8 py-6 border-t-4';
    footerInner.style.borderColor = accentHex;
    byPos.footer.forEach(function(el) { footerInner.appendChild(el); });
    footerEl.appendChild(footerInner);
    wrap.appendChild(footerEl);
  }

  grid.parentNode.replaceChild(wrap, grid);
})();
</script>
</main>

      region.classList.add('si-region-selected');
      window.parent.postMessage({type:'region-selected',region:'sidebar',side:region.dataset.regionSide || ''},'*');
      return;

    document.querySelectorAll('[data-section-id]').forEach(function(x){x.classList.remove('si-selected')});
    document.querySelectorAll('aside[data-region-side]').forEach(function(x){x.classList.remove('si-region-selected')});

<script>
(function() {
  var kw = {
    success: /\b(active|approved|success|paid|completed|confirmed|verified|enabled|done|shipped)\b/i,
    error:   /\b(rejected|failed|error|cancelled|canceled|declined|inactive|disabled|expired|denied)\b/i,
    warning: /\b(pending|processing|draft|review|waiting|hold|queued)\b/i,
  };
  document.querySelectorAll('.si-badge').forEach(function(el) {
    var t = el.textContent.trim();
    if (kw.success.test(t))      { el.className = 'si-badge si-badge-success'; }
    else if (kw.error.test(t))   { el.className = 'si-badge si-badge-error'; }
    else if (kw.warning.test(t)) { el.className = 'si-badge si-badge-warning'; }
    else                         { el.className = 'si-badge si-badge-neutral'; }
  });
})();
</script>

<script>
/* éˆ¹â‚¬éˆ¹â‚¬ Multi-select (si-selectable sections) éˆ¹â‚¬éˆ¹â‚¬ */
(function() {
  var bars = {};
  document.querySelectorAll('[data-selectable]').forEach(function(grid) {
    var sid = grid.dataset.selectable;
    var bar = document.createElement('div');
    bar.className = 'si-sel-bar';
    bar.id = 'sel-bar-' + sid;
    bar.innerHTML = '<span class="sel-count">0 selected</span>'
      + '<button onclick="siSelClear(\'' + sid + '\')">Clear</button>'
      + '<button class="danger" onclick="siSelDelete(\'' + sid + '\')">Delete selected</button>';
    document.body.appendChild(bar);
    bars[sid] = bar;
  });

  window.siSelUpdate = function(sid) {
    var grid = document.querySelector('[data-selectable="' + sid + '"]');
    if (!grid) return;
    var selected = grid.querySelectorAll('.si-selected');
    var bar = bars[sid];
    if (!bar) return;
    bar.querySelector('.sel-count').textContent = selected.length + ' selected';
    bar.classList.toggle('active', selected.length > 0);
  };

  window.siSelClear = function(sid) {
    var grid = document.querySelector('[data-selectable="' + sid + '"]');
    if (grid) grid.querySelectorAll('.si-selected').forEach(function(el) { el.classList.remove('si-selected'); });
    siSelUpdate(sid);
  };

  function siGetCsrfToken() {
    var input = document.querySelector('input[name="csrfmiddlewaretoken"]');
    if (input && input.value) return input.value;
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }

  window.siSelDelete = function(sid) {
    var grid = document.querySelector('[data-selectable="' + sid + '"]');
    if (!grid) return;
    var selected = Array.from(grid.querySelectorAll('.si-selected[data-item-idx]'));
    var ids = selected.map(function(el) { return el.dataset.itemIdx; });
    var urls = selected.map(function(el) { return el.dataset.deleteUrl; }).filter(Boolean);
    if (!urls.length) {
      window.parent.postMessage({ type: 'si-select-delete', sectionId: sid, indices: ids }, '*');
      selected.forEach(function(el) { el.classList.add('opacity-30'); el.classList.remove('si-selected'); });
      siSelUpdate(sid);
      return;
    }
    if (!window.confirm('Delete ' + urls.length + ' selected item' + (urls.length === 1 ? '' : 's') + '?')) return;
    var csrf = siGetCsrfToken();
    Promise.all(urls.map(function(url) {
      return fetch(url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: csrf ? { 'X-CSRFToken': csrf } : {}
      });
    })).then(function(responses) {
      var failed = responses.filter(function(response) { return !response.ok; });
      if (failed.length) window.alert('Some selected items could not be deleted.');
      window.location.reload();
    }).catch(function() {
      window.alert('Could not delete selected items.');
    });
  };

  document.addEventListener('click', function(e) {
    var item = e.target.closest('.si-sel-item[data-selectable-sid]');
    if (!item) return;
    var sid = item.dataset.selectableSid;
    var grid = item.closest('[data-selectable]');
    if (e.shiftKey && grid) {
      var items = Array.from(grid.querySelectorAll('.si-sel-item'));
      var lastSel = grid.querySelector('.si-last-sel');
      var start = lastSel ? items.indexOf(lastSel) : 0;
      var end = items.indexOf(item);
      if (start > end) { var tmp = start; start = end; end = tmp; }
      items.slice(start, end + 1).forEach(function(el) { el.classList.add('si-selected'); });
    } else {
      item.classList.toggle('si-selected');
      if (item.classList.contains('si-selected') && grid) {
        grid.querySelectorAll('.si-last-sel').forEach(function(el) { el.classList.remove('si-last-sel'); });
        item.classList.add('si-last-sel');
      }
    }
    siSelUpdate(sid);
  }, true);
})();
</script>

<style>
/* éˆ¹â‚¬éˆ¹â‚¬ Drag-and-drop sections éˆ¹â‚¬éˆ¹â‚¬ */
[data-section-id] { position: relative; }
/* Full-width drag bar at top of section (starts below the top-resize handle) */
.si-move-bar {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px;
  cursor: grab; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s, background 0.1s;
  user-select: none;
  background: rgba(255,255,255,0.92);

/* éˆ¹â‚¬éˆ¹â‚¬ Section resize (left + right handles) éˆ¹â‚¬éˆ¹â‚¬ */
.si-resize-handle, .si-lresize-handle {

.si-vresize-handle, .si-tresize-handle {

/* Lift hovered/active section above adjacent content so handles are always on top */

/* Left/right insert indicators during drag-over */

<script>
/* éˆ¹â‚¬éˆ¹â‚¬ Section right-click context menu éˆ¹â‚¬éˆ¹â‚¬ */
(function() {
  var menu = null;

  function hideMenu() {
    if (menu) { menu.remove(); menu = null; }
  }

  function showMenu(x, y, sectionId) {
    hideMenu();

    menu = document.createElement('div');
    menu.className = 'si-ctx-menu';
    menu.style.left = x + 'px';
    menu.style.top  = y + 'px';

    // sectionId is captured here in the closure éˆ?safe from hideMenu clearing it
    function item(icon, label, cls, action) {
      var el = document.createElement('div');
      el.className = 'si-ctx-item' + (cls ? ' ' + cls : '');
      el.innerHTML = icon + '<span>' + label + '</span>';
      el.addEventListener('mousedown', function(e) { e.stopPropagation(); });
      el.addEventListener('click', function() {
        hideMenu();
        action(sectionId);   // sectionId from outer closure, already captured
      });
      return el;
    }

    menu.appendChild(item(
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      'Duplicate', '', function(id) {
        window.parent.postMessage({ type: 'section-duplicate', id: id }, '*');
      }
    ));

    menu.appendChild(item(
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>',
      'Delete', 'danger', function(id) {
        window.parent.postMessage({ type: 'section-delete', id: id }, '*');
      }
    ));

    document.body.appendChild(menu);

    // Flip if menu overflows viewport
    var rect = menu.getBoundingClientRect();
    if (rect.right  > window.innerWidth)  menu.style.left = (x - rect.width)  + 'px';
    if (rect.bottom > window.innerHeight) menu.style.top  = (y - rect.height) + 'px';
  }

  document.querySelectorAll('[data-section-id]').forEach(function(el) {
    el.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      e.stopPropagation();
      showMenu(e.clientX, e.clientY, el.dataset.sectionId);
    });
  });

  document.addEventListener('mousedown', function(e) {
    if (menu && !menu.contains(e.target)) hideMenu();
  });
  document.addEventListener('scroll', hideMenu, true);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideMenu();
  });
})();
</script>

<script>
/* éˆ¹â‚¬éˆ¹â‚¬ Section drag-and-drop (pure mouse events, tracks drop target during mousemove) éˆ¹â‚¬éˆ¹â‚¬ */
(function() {
  var dragging = false;
  var draggingId = null;
  var draggingEl = null;
  var currentDrop = null; // updated every mousemove
  var dropLayer = null;

  function allSections() {
    return Array.from(document.querySelectorAll('[data-section-id]'));
  }

  function sectionRegion(el) {
    var pos = el.dataset.position || 'main';
    return ['header', 'hero', 'main', 'sidebar', 'footer'].indexOf(pos) >= 0 ? pos : 'main';
  }

  function regionBounds(region) {
    var secs = allSections().filter(function(el) { return sectionRegion(el) === region; });
    if (!secs.length) return null;
    var tops = secs.map(function(el) { return el.getBoundingClientRect().top; });
    var bots = secs.map(function(el) { return el.getBoundingClientRect().bottom; });
    return { top: Math.min.apply(null, tops), bottom: Math.max.apply(null, bots) };
  }

  function showDropZones() {
    if (dropLayer) return;
    dropLayer = document.createElement('div');
    dropLayer.className = 'si-drop-layer';
    [
      ['header', '', 'Header'],
      ['hero', '', 'Hero'],
      ['sidebar', 'left', 'Left Sidebar'],
      ['main', '', 'Main'],
      ['sidebar', 'right', 'Right Sidebar'],
      ['footer', '', 'Footer']
    ].forEach(function(spec) {
      var region = spec[0], side = spec[1], label = spec[2];
      var zone = document.createElement('div');
      zone.className = 'si-drop-zone si-drop-zone-' + (side ? side + '-' : '') + region;
      zone.dataset.dropRegion = region;
      if (side) zone.dataset.dropSidebarSide = side;
      zone.textContent = 'Drop in ' + label;
      dropLayer.appendChild(zone);
    });
    document.body.appendChild(dropLayer);
  }

  function hideDropZones() {
    if (dropLayer) { dropLayer.remove(); dropLayer = null; }
  }

  function setActiveDropZone(drop) {
    if (!dropLayer) return;
    dropLayer.querySelectorAll('.si-drop-zone').forEach(function(zone) {
      var sameRegion = zone.dataset.dropRegion === (drop && drop.position);
      var sameSide = (zone.dataset.dropSidebarSide || '') === (drop && drop.sidebarSide || '');
      zone.classList.toggle('active', sameRegion && sameSide);
    });
  }

  function pointContext(x, y) {
    var stack = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
    var hitSec = null, hitZone = null;
    for (var i = 0; i < stack.length; i++) {
      if (!hitSec && stack[i].closest) {
        var sec = stack[i].closest('[data-section-id]');
        if (sec && sec.dataset.sectionId !== draggingId) hitSec = sec;
      }
      if (!hitZone && stack[i].closest) {
        hitZone = stack[i].closest('[data-drop-region]');
      }
    }
    if (hitSec) return { region: sectionRegion(hitSec), sidebarSide: hitSec.dataset.sidebarSide || '', hitSection: hitSec };
    if (hitZone) return { region: hitZone.dataset.dropRegion || 'main', sidebarSide: hitZone.dataset.dropSidebarSide || '', hitSection: null };

    var hb = regionBounds('header');
    var heroB = regionBounds('hero');
    var mb = regionBounds('main');
    var sb = regionBounds('sidebar');
    var fb = regionBounds('footer');

    if (hb && y <= hb.bottom + 48) return { region: 'header', sidebarSide: '' };
    if (fb && y >= fb.top - 48) return { region: 'footer', sidebarSide: '' };
    if (!fb && y >= window.innerHeight * 0.82) return { region: 'footer', sidebarSide: '' };

    if (sb && y >= sb.top - 24 && y <= sb.bottom + 24) {
      var sidebarSecs = siblingsIn('sidebar');
      if (sidebarSecs.length) {
        var left = Math.min.apply(null, sidebarSecs.map(function(el) { return el.getBoundingClientRect().left; }));
        var right = Math.max.apply(null, sidebarSecs.map(function(el) { return el.getBoundingClientRect().right; }));
        if (x >= left - 48 && x <= right + 48) return { region: 'sidebar', sidebarSide: '' };
      }
    }

    if (hb && mb) {
      var headerMainSplit = hb.bottom + (mb.top - hb.bottom) / 2;
      if (y < headerMainSplit) return { region: 'header', sidebarSide: '' };
    } else if (!hb && mb && y < mb.top - 24) {
      return { region: 'header', sidebarSide: '' };
    }

    if (heroB && y >= heroB.top - 24 && y <= heroB.bottom + 24) return { region: 'hero', sidebarSide: '' };

    if (mb && fb) {
      var mainFooterSplit = mb.bottom + (fb.top - mb.bottom) / 2;
      if (y > mainFooterSplit) return { region: 'footer', sidebarSide: '' };
    } else if (!fb && mb && y > mb.bottom + 24) {
      return { region: 'footer', sidebarSide: '' };
    }

    return { region: 'main', sidebarSide: '' };
  }

  // Sections in a given region, excluding the section being dragged
  function siblingsIn(region) {
    return allSections().filter(function(el) {
      if (el.dataset.sectionId === draggingId) return false;
      return sectionRegion(el) === region;
    });
  }

  // Group flat list of sections into visual rows (sections with similar .top within 20px)
  function toRows(secs) {
    var rows = [];
    secs.forEach(function(sec) {
      var r = sec.getBoundingClientRect();
      for (var i = 0; i < rows.length; i++) {
        if (Math.abs(r.top - rows[i].top) < 20) {
          rows[i].secs.push(sec);
          rows[i].bottom = Math.max(rows[i].bottom, r.bottom);
          return;
        }
      }
      rows.push({ top: r.top, bottom: r.bottom, secs: [sec] });
    });
    rows.sort(function(a, b) { return a.top - b.top; });
    return rows;
  }

  function findDrop(mx, my) {
    var ctx = pointContext(mx, my);
    var region = ctx.region || 'main';
    var sidebarSide = ctx.sidebarSide || '';
    var secs = siblingsIn(region);
    if (region === 'sidebar' && sidebarSide) {
      secs = secs.filter(function(el) { return (el.dataset.sidebarSide || '') === sidebarSide; });
    }

    if (secs.length === 0) {
      return { beforeId: '__end__', position: region, sidebarSide: sidebarSide, indicEl: null, indicSide: null };
    }

    var rows = toRows(secs);

    // Above all rows
    if (my < rows[0].top) {
      var s0 = rows[0].secs[0];
      return { beforeId: s0.dataset.sectionId, position: region, sidebarSide: sidebarSide, indicEl: s0, indicSide: 'row-before' };
    }
    // Below all rows
    var last = rows[rows.length - 1];
    if (my > last.bottom) {
      var sLast = last.secs[last.secs.length - 1];
      return { beforeId: '__end__', position: region, sidebarSide: sidebarSide, indicEl: sLast, indicSide: 'row-after' };
    }

    // Find the row containing cursor Y (or the nearest one)
    var ri = 0;
    for (var r = 0; r < rows.length; r++) {
      if (my <= rows[r].bottom) { ri = r; break; }
    }
    var row = rows[ri];

    // Sort row sections leftéˆ«æŠ®ight
    var rowSecs = row.secs.slice().sort(function(a, b) {
      return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
    });

    if (my < row.top + (row.bottom - row.top) * 0.25) {
      return { beforeId: rowSecs[0].dataset.sectionId, position: region, sidebarSide: sidebarSide, indicEl: rowSecs[0], indicSide: 'row-before' };
    }
    if (my > row.top + (row.bottom - row.top) * 0.75) {
      var belowId = (ri + 1 < rows.length) ? rows[ri + 1].secs[0].dataset.sectionId : '__end__';
      return { beforeId: belowId, position: region, sidebarSide: sidebarSide, indicEl: rowSecs[rowSecs.length - 1], indicSide: 'row-after' };
    }

    // Scan leftéˆ«æŠ®ight to find insert position within the row
    for (var s = 0; s < rowSecs.length; s++) {
      var sr = rowSecs[s].getBoundingClientRect();
      var midX = sr.left + sr.width / 2;
      if (mx <= midX) {
        return { beforeId: rowSecs[s].dataset.sectionId, position: region, sidebarSide: sidebarSide, indicEl: rowSecs[s], indicSide: 'before' };
      }
    }

    // Mouse is past the last section in the row éˆ?insert at start of next row (or end)
    var lastInRow = rowSecs[rowSecs.length - 1];
    var nextId = (ri + 1 < rows.length) ? rows[ri + 1].secs[0].dataset.sectionId : '__end__';
    return { beforeId: nextId, position: region, sidebarSide: sidebarSide, indicEl: lastInRow, indicSide: 'after' };
  }

  function clearIndicators() {
    allSections().forEach(function(el) {
      el.classList.remove('si-drag-before', 'si-drag-after', 'si-drag-row-before', 'si-drag-row-after');
    });
  }

  // Attach move bars to ALL sections including header/footer
  allSections().forEach(function(el) {
    var bar = document.createElement('div');
    bar.className = 'si-move-bar';
    bar.title = 'Drag to move';
    el.appendChild(bar);

    bar.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      draggingId = el.dataset.sectionId;
      draggingEl = el;
      el.classList.add('si-dragging');
      el.style.pointerEvents = 'none';
      document.body.style.cursor = 'grabbing';
      showDropZones();
    });
  });

  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    clearIndicators();
    currentDrop = findDrop(e.clientX, e.clientY);
    setActiveDropZone(currentDrop);
    if (currentDrop.indicEl) {
      var cls = currentDrop.indicSide === 'before'     ? 'si-drag-before'
              : currentDrop.indicSide === 'after'      ? 'si-drag-after'
              : currentDrop.indicSide === 'row-before' ? 'si-drag-row-before'
              :                                          'si-drag-row-after';
      currentDrop.indicEl.classList.add(cls);
    }
  }, { passive: true });

  document.addEventListener('mouseup', function(e) {
    if (!dragging) return;
    var fromId = draggingId;
    var drop = currentDrop;

    if (draggingEl) {
      draggingEl.classList.remove('si-dragging');
      draggingEl.style.pointerEvents = '';
    }
    dragging = false; draggingId = null; draggingEl = null; currentDrop = null;
    document.body.style.cursor = '';
    clearIndicators();
    hideDropZones();

    if (fromId && drop && drop.beforeId) {
      window.parent.postMessage({
        type: 'section-move',
        fromId: fromId,
        beforeId: drop.beforeId,
        newPosition: drop.position,
        sidebarSide: drop.sidebarSide || ''
      }, '*');
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && dragging) {
      if (draggingEl) {
        draggingEl.classList.remove('si-dragging');
        draggingEl.style.pointerEvents = '';
      }
      dragging = false; draggingId = null; draggingEl = null; currentDrop = null;
      document.body.style.cursor = '';
      clearIndicators();
      hideDropZones();
    }
  });
})();
</script>

<script>
/* éˆ¹â‚¬éˆ¹â‚¬ Section column-span resize (left + right handles) éˆ¹â‚¬éˆ¹â‚¬ */
(function() {
  var resizing = false;
  var resizingEl = null;
  var resizingId = null;
  var startColSpan = 1;
  var startLeft = 0;   // element's left edge at drag start (fixed anchor for right handle)
  var startRight = 0;  // element's right edge at drag start (fixed anchor for left handle)
  var snapLine = null;
  var tooltip = null;
  var currentColSpan = 1;
  var resizeDir = 'right';
  var resizeMode = 'section';

  function getColSpan(el) {
    // Prefer the largest-breakpoint class: lg > sm > bare (handles "_spanm" responsive strings)
    var classes = Array.from(el.classList);
    var lg = classes.find(function(c) { return /^lg:col-span-\d+$/.test(c); });
    if (lg) return parseInt(lg.replace('lg:col-span-', ''), 10);
    var sm = classes.find(function(c) { return /^sm:col-span-\d+$/.test(c); });
    if (sm) return parseInt(sm.replace('sm:col-span-', ''), 10);
    var bare = classes.find(function(c) { return /^col-span-\d+$/.test(c); });
    return bare ? parseInt(bare.replace('col-span-', ''), 10) : 12;
  }

  function setColSpan(el, n) {
    // Remove all responsive col-span variants before adding the new one
    Array.from(el.classList)
      .filter(function(c) { return /^(?:(?:sm|md|lg|xl|2xl):)?col-span-\d+$/.test(c); })
      .forEach(function(c) { el.classList.remove(c); });
    el.classList.add('col-span-' + n);
  }

  document.querySelectorAll('[data-section-id]').forEach(function(el) {
    var rHandle = document.createElement('div');
    rHandle.className = 'si-resize-handle';
    rHandle.title = 'Drag to resize width';
    el.appendChild(rHandle);

    var lHandle = document.createElement('div');
    lHandle.className = 'si-lresize-handle';
    lHandle.title = 'Drag to resize width';
    el.appendChild(lHandle);

    function startResize(e, dir) {
      e.preventDefault();
      e.stopPropagation();
      var rect = el.getBoundingClientRect();
      resizing = true;
      resizingEl = el;
      resizingId = el.dataset.sectionId;
      resizeMode = (el.dataset.position || '') === 'sidebar' ? 'sidebar' : 'section';
      startColSpan = resizeMode === 'sidebar'
        ? parseInt(el.dataset.sidebarWidth || (el.closest('aside') && el.closest('aside').dataset.sidebarSpan) || '3', 10)
        : getColSpan(el);
      currentColSpan = startColSpan;
      startLeft = rect.left;
      startRight = rect.right;
      resizeDir = dir;
      el.classList.add('si-resizing');

      snapLine = document.createElement('div');
      snapLine.className = 'si-resize-snap-line';
      document.body.appendChild(snapLine);

      tooltip = document.createElement('div');
      tooltip.className = 'si-resize-tooltip';
      tooltip.textContent = startColSpan + '/12';
      document.body.appendChild(tooltip);
    }

    rHandle.addEventListener('mousedown', function(e) { startResize(e, 'right'); });
    lHandle.addEventListener('mousedown', function(e) { startResize(e, 'left'); });
  });

  document.addEventListener('mousemove', function(e) {
    if (!resizing || !resizingEl) return;
    var grid = resizeMode === 'sidebar'
      ? (resizingEl.closest('[data-region-row]') || resizingEl.closest('main') || resizingEl.parentElement)
      : (resizingEl.closest('.grid-cols-12') || document.getElementById('page-sections-grid') || resizingEl.parentElement);
    if (!grid) return;
    var colW = grid.getBoundingClientRect().width / 12;
    // Right: distance from element's fixed left edge to cursor
    // Left:  distance from cursor to element's initial right edge
    var newW = resizeDir === 'right'
      ? e.clientX - startLeft
      : startRight - e.clientX;
    var n = resizeMode === 'sidebar'
      ? Math.max(2, Math.min(6, Math.round(newW / colW)))
      : Math.max(1, Math.min(12, Math.round(newW / colW)));
    if (n !== currentColSpan) {
      currentColSpan = n;
      if (resizeMode === 'sidebar') {
        var aside = resizingEl.closest('aside');
        if (aside) {
          aside.dataset.sidebarSpan = String(n);
          aside.style.flexBasis = 'calc((100% - 1.5rem) * ' + n + ' / 12)';
          aside.style.maxWidth = aside.style.flexBasis;
        }
        resizingEl.dataset.sidebarWidth = String(n);
      } else {
        setColSpan(resizingEl, n);
      }
    }
    if (resizeDir === 'left') {
      // Shift element right so its right edge stays fixed éˆ?left edge appears to move
      var tx = (startColSpan - n) * colW;
      resizingEl.style.transform = 'translateX(' + tx + 'px)';
      // Snap line and tooltip at the apparent left edge
      var snapX = startRight - n * colW;
      if (snapLine) { snapLine.style.left = snapX + 'px'; }
      if (tooltip) {
        tooltip.textContent = n + '/12';
        tooltip.style.left = snapX + 'px';
        tooltip.style.top = (resizingEl.getBoundingClientRect().top - 24) + 'px';
      }
    } else {
      resizingEl.style.transform = '';
      var snapX = startLeft + n * colW;
      if (snapLine) { snapLine.style.left = snapX + 'px'; }
      if (tooltip) {
        tooltip.textContent = n + '/12';
        tooltip.style.left = snapX + 'px';
        tooltip.style.top = (resizingEl.getBoundingClientRect().top - 24) + 'px';
      }
    }
  }, { passive: true });

  document.addEventListener('mouseup', function() {
    if (!resizing) return;
    if (snapLine) { snapLine.remove(); snapLine = null; }
    if (tooltip)  { tooltip.remove();  tooltip = null; }
    if (resizingEl) {
      resizingEl.classList.remove('si-resizing');
      resizingEl.style.transform = '';
    }
    if (resizingId && currentColSpan !== startColSpan && resizeMode === 'sidebar') {
      window.parent.postMessage({ type: 'section-sidebar-width', id: resizingId, sidebar_width: currentColSpan }, '*');
    } else if (resizingId && currentColSpan !== startColSpan) {
      window.parent.postMessage({ type: 'section-resize', id: resizingId, col_span: currentColSpan }, '*');
    }
    resizing = false;
    resizingEl = null;
    resizingId = null;
    resizeMode = 'section';
  });
})();
</script>

<script>
/* éˆ¹â‚¬éˆ¹â‚¬ Section vertical height resize (top + bottom handles) éˆ¹â‚¬éˆ¹â‚¬ */
(function() {
  var vresizing = false;
  var vresizingEl = null;
  var vresizingId = null;
  var startY = 0;
  var startH = 0;
  var hline = null;
  var vtip = null;
  var currentH = 0;
  var vresizeDir = 'bottom';

  document.querySelectorAll('[data-section-id]').forEach(function(el) {
    var bHandle = document.createElement('div');
    bHandle.className = 'si-vresize-handle';
    bHandle.title = 'Drag to resize height';
    el.appendChild(bHandle);

    var tHandle = document.createElement('div');
    tHandle.className = 'si-tresize-handle';
    tHandle.title = 'Drag to resize height';
    el.appendChild(tHandle);

    function startVResize(e, dir) {
      e.preventDefault();
      e.stopPropagation();
      vresizing = true;
      vresizingEl = el;
      vresizingId = el.dataset.sectionId;
      startY = e.clientY;
      startH = el.getBoundingClientRect().height;
      currentH = startH;
      vresizeDir = dir;
      el.classList.add('si-vresizing');

      hline = document.createElement('div');
      hline.className = 'si-vresize-hline';
      hline.style.top = e.clientY + 'px';
      document.body.appendChild(hline);

      vtip = document.createElement('div');
      vtip.className = 'si-vresize-tip';
      vtip.textContent = Math.round(startH) + 'px';
      vtip.style.top = (e.clientY + 6) + 'px';
      vtip.style.left = (e.clientX + 12) + 'px';
      document.body.appendChild(vtip);
    }

    bHandle.addEventListener('mousedown', function(e) { startVResize(e, 'bottom'); });
    tHandle.addEventListener('mousedown', function(e) { startVResize(e, 'top'); });
  });

  document.addEventListener('mousemove', function(e) {
    if (!vresizing || !vresizingEl) return;
    var delta = vresizeDir === 'bottom'
      ? e.clientY - startY        // bottom: drag down = taller
      : startY - e.clientY;       // top:    drag up   = taller
    var newH = Math.max(40, startH + delta);
    currentH = newH;
    vresizingEl.style.height = newH + 'px';
    vresizingEl.style.minHeight = newH + 'px';
    vresizingEl.style.overflow = 'hidden';
    if (vresizeDir === 'top') {
      // Shift element down so its bottom edge stays fixed éˆ?top edge appears to move
      var ty = startH - newH;
      vresizingEl.style.transform = 'translateY(' + ty + 'px)';
      // Guide line follows the apparent top edge (getBoundingClientRect accounts for transform)
      if (hline) hline.style.top = vresizingEl.getBoundingClientRect().top + 'px';
    } else {
      vresizingEl.style.transform = '';
      if (hline) hline.style.top = e.clientY + 'px';
    }
    if (vtip) {
      vtip.textContent = Math.round(newH) + 'px';
      vtip.style.top = (e.clientY + 6) + 'px';
      vtip.style.left = (e.clientX + 12) + 'px';
    }
  }, { passive: true });

  document.addEventListener('mouseup', function() {
    if (!vresizing) return;
    if (hline) { hline.remove(); hline = null; }
    if (vtip)  { vtip.remove();  vtip = null; }
    if (vresizingEl) {
      vresizingEl.classList.remove('si-vresizing');
      vresizingEl.style.height = '';
      vresizingEl.style.minHeight = Math.round(currentH) + 'px';
      vresizingEl.style.overflow = '';
      vresizingEl.style.transform = '';
    }
    if (vresizingId && Math.abs(currentH - startH) > 4) {
      window.parent.postMessage({ type: 'section-height', id: vresizingId, min_height: Math.round(currentH) }, '*');
    }
    vresizing = false;
    vresizingEl = null;
    vresizingId = null;
  });
})();
</script>
