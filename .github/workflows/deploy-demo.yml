name: Deploy to Oracle Cloud (demo)

on:
  push:
    branches:
      - develop-uilayout-revise

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 60m
          script: |
            cd ~/studio
            git pull origin develop-uilayout-revise
            echo "ORACLE_IP=${{ secrets.ORACLE_HOST }}" > .env
            docker compose -f docker-compose.yaml -f docker-compose.cloud.yml up --build -d
            docker image prune -f
