[tool.poetry]
name = "ai4mde-studio"
version = "1.0.0"
description = "AI-assisted Model Driven Engineering"
authors = ["Max Boone <contact@maxboone.com>"]
license = "GPLv3"
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.12,<3.14"
django = "^5.2"
psycopg2-binary = "^2.9.13"
django-ninja = "^1.7.1"
pyjwt = "^2.15.1"
django-cors-headers = "^4.9.0"
daphne = "^4.2.3"
channels = "^4.3.2"
sentry-sdk = "^1.40.4"
jinja2 = "^3.1.6"
requests = "^2.34.2"
openai = "^3.20.0"
networkx = "^3.7"
numpy = "^2.5.3"
groq = "^1.7.0"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
ruff = "^0.16.9"
django-stubs = {version = "^5.2", extras = ["compatible-mypy"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["channels.*"]
follow_untyped_imports = true

[tool.django-stubs]
django_settings_module = "model.settings"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
