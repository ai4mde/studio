[tool.poetry]
name = "ai4mde-studio"
version = "1.0.0"
description = "AI-assisted Model Driven Engineering"
authors = ["Max Boone <contact@maxboone.com>"]
license = "GPLv3"
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.12"
django = "6.0.6"
psycopg2-binary = "^2.9.9"
django-ninja = "^1.1.0"
pyjwt = "^2.8.0"
django-cors-headers = "^4.3.1"
daphne = "^4.0.0"
channels = "^4.0.0"
sentry-sdk = "^2.64.0"
drf-yasg = "^1.21.7"
jinja2 = "^3.1.4"
requests = "^2.32.3"
openai = "^2.0.0"
networkx = "^3.4.2"
numpy = "^2.2.1"
groq = "^1.0.0"
django-stubs = "^6.0.6"

[tool.poetry.group.dev.dependencies]
black = "^26.0.0"
ruff = "^0.15.0"
django-stubs = {extras = ["compatible-mypy"], version = "^6.0.6"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "model.settings"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.1.3"
myst-parser = "^4.0.0"
sphinx-autodoc-typehints = "^3.0.0"
furo = "^2024.8.6"