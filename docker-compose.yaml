version: "3.3"

services:
  traefik:
    image: "traefik:v3.6.7"
    container_name: "traefik"
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ai4mde_traefik"
      - "--entrypoints.web.address=:80"
    networks:
      - ai4mde_traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: config/postgres.env
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=20
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - ai4mde_traefik

  studio-api:
    restart: unless-stopped
    depends_on: ["postgres"]
    build:
      context: api
    command: ["python", "/usr/src/model/manage.py", "runserver", "--noreload", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    env_file:
      - config/api.env
      - config/secrets.env
    environment:
      - INTERNAL_API_KEY=studio-internal-service-key
      - ADK_AGENT_URL=http://gemini-make-agent:8080
    networks:
      - ai4mde_traefik
    volumes:
      - ./api/model:/usr/src/model:ro
      - ./prototypes/backend/generation/templates:/usr/src/templates:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio-api.rule=Host(`api.ai4mde.localhost`)"
      - "traefik.http.routers.studio-api.entrypoints=web"
      - "traefik.http.services.studio-api.loadbalancer.server.port=8000"

  studio-prototypes:
    restart: unless-stopped
    depends_on: ["postgres"]
    build:
      context: prototypes
    env_file: config/prototypes.env
    networks:
      - ai4mde_traefik
    volumes:
      - ./prototypes:/usr/src/prototypes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flask_api_router.rule=Host(`prototypes_api.ai4mde.localhost`)"
      - "traefik.http.routers.flask_api_router.service=flask_api_service"
      - "traefik.http.services.flask_api_service.loadbalancer.server.port=8010"
      - "traefik.http.routers.django_prototype_router.rule=Host(`prototype.ai4mde.localhost`)"
      - "traefik.http.routers.django_prototype_router.service=django_prototype_service"
      - "traefik.http.services.django_prototype_service.loadbalancer.server.port=8020"

  gemini-make-agent:
    restart: unless-stopped
    build:
      context: api/model/gemini-make-agent
    ports:
      - "8081:8080"
    env_file:
      - config/secrets.env
    environment:
      - METADATA_API_BASE=http://studio-api:8000/api/v1/metadata
      - METADATA_API_KEY=studio-internal-service-key
      - ALLOW_ORIGINS=http://ai4mde.localhost
      - SESSION_SERVICE_URI=memory://
    volumes:
      - ./api/model/gemini-make-agent/app:/code/app:ro
      - ./api/model/gemini-make-agent/candidate_app:/code/candidate_app:ro
      - ./api/model/gemini-make-agent/candidate_regeneration_app:/code/candidate_regeneration_app:ro
      - ./design_specs:/design_specs:ro
    networks:
      - ai4mde_traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gemini-agent.rule=Host(`agent.ai4mde.localhost`)"
      - "traefik.http.routers.gemini-agent.entrypoints=web"
      - "traefik.http.services.gemini-agent.loadbalancer.server.port=8080"
      - "traefik.http.services.gemini-agent.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.gemini-agent.loadbalancer.healthcheck.interval=60s"

  studio:
    restart: unless-stopped
    build:
      context: frontend
    env_file: config/frontend.env
    volumes:
      - ./frontend/src:/usr/src/app/src:ro
    networks:
      - ai4mde_traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.rule=Host(`ai4mde.localhost`)"
      - "traefik.http.routers.studio.entrypoints=web"
      - "traefik.http.services.studio.loadbalancer.server.port=5173"

volumes:
  pgsql-data:
  
networks:
  ai4mde_traefik:
    name: "ai4mde_traefik"
  postgres:
